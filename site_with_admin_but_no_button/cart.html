<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Корзина — Лепестки</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:url('фыв.jpg') center/cover fixed;} .overlay{position:fixed;inset:0;background:rgba(7,10,25,0.5);backdrop-filter:blur(6px);z-index:0} .container{position:relative;z-index:1;max-width:900px;margin:40px auto;padding:24px}</style></head><body><div class="overlay"></div><div class="container text-white"><header class="flex items-center justify-between mb-6"><h1 class="text-3xl font-bold">Корзина</h1><a href="lepestok_shop.html" class="text-sm text-white/80">← Вернуться</a></header><div id="items"></div><div class="mt-6 flex gap-3"><button id="toCheckout" class="px-4 py-2 bg-emerald-500 rounded">Оформить заказ</button><button id="clear" class="px-4 py-2 border rounded">Очистить</button></div></div><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function render(){const cart=load('cart');const out=document.getElementById('items');if(!cart.length){out.innerHTML='<div class="p-6 bg-white/80 rounded text-slate-800">Корзина пуста</div>';return;} let total=0; out.innerHTML = cart.map((it,idx)=>{ total += (Number(it.price)||0)*(it.qty||1); return `<div class="bg-white/90 rounded p-4 mb-3 flex items-center gap-4"><img src="${it.img||'6873440802.jpg'}" class="w-24 h-20 object-contain rounded"/><div class="flex-1"><div class="font-semibold text-slate-800">${it.title}</div><div class="text-sm text-slate-600">${it.desc||''}</div><div class="mt-2 flex items-center gap-2"><button onclick="chg(${idx},-1)" class="px-2 py-1 border rounded">-</button><span id="q${idx}">${it.qty||1}</span><button onclick="chg(${idx},1)" class="px-2 py-1 border rounded">+</button></div></div><div class="text-right"><div class="font-bold text-emerald-600">${(Number(it.price)||0).toFixed(2)} ₽</div><button onclick="rem(${idx})" class="mt-3 px-3 py-1 bg-red-500 text-white rounded">Удалить</button></div></div>` }).join(''); out.innerHTML += `<div class="p-4 bg-white/80 rounded text-slate-800 font-bold">Итого: ${total.toFixed(2)} ₽</div>`;} function chg(i,d){const cart=load('cart'); if(!cart[i]) return; cart[i].qty = Math.max(1,(cart[i].qty||1)+d); save('cart',cart); render();} function rem(i){const cart=load('cart'); cart.splice(i,1); save('cart',cart); render();} document.getElementById('clear').addEventListener('click',()=>{localStorage.removeItem('cart'); render();}); document.getElementById('toCheckout').addEventListener('click',()=>{location.href='checkout.html'}); render();</script></body></html>
