<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Спасибо</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:url('фыв.jpg') center/cover fixed;} .overlay{position:fixed;inset:0;background:rgba(7,10,25,0.5);backdrop-filter:blur(6px);z-index:0} .container{position:relative;z-index:1;max-width:760px;margin:40px auto;padding:24px}</style></head><body><div class="overlay"></div><div class="container text-white"><h1 class="text-2xl font-bold mb-3">Спасибо — заказ оформлен</h1><div id="out"></div><a href="lepestok_shop.html" class="mt-4 inline-block px-4 py-2 bg-emerald-500 rounded">Вернуться</a></div><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}} function qs(n){return new URL(location).searchParams.get(n)} const id = qs('order'); const orders = load('orders'); const ord = orders.find(o=>String(o.id)===String(id)); if(!ord) document.getElementById('out').innerText='Заказ не найден'; else document.getElementById('out').innerHTML = `<div>Номер: <strong>${ord.id}</strong></div><div>Имя: <strong>${ord.name}</strong></div><div>Телефон: <strong>${ord.phone}</strong></div><div>Адрес: <strong>${ord.address} ${ord.apt||''}</strong></div><div>Товары:<ul>${ord.items.map(i=>'<li>'+ (i.title||i.name||'') + ' × ' + (i.qty||1) + '</li>').join('')}</ul></div><div class='mt-2 font-bold'>Итого: ${Number(ord.total).toFixed(2)} ₽</div>`;</script></body></html>
