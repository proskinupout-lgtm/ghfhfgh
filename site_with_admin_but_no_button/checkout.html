<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Оформление заказа</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:url('фыв.jpg') center/cover fixed;} .overlay{position:fixed;inset:0;background:rgba(7,10,25,0.5);backdrop-filter:blur(6px);z-index:0} .container{position:relative;z-index:1;max-width:760px;margin:40px auto;padding:24px}</style></head><body><div class="overlay"></div><div class="container text-white"><h1 class="text-2xl font-bold mb-3">Оформление заказа</h1><form id="form" class="space-y-3"><label>ФИО<br/><input id="name" required class="w-full p-2 rounded text-black"/></label><label>Телефон<br/><input id="phone" value="89080201966" required class="w-full p-2 rounded text-black"/></label><label>Улица, дом<br/><input id="address" required class="w-full p-2 rounded text-black"/></label><label>Квартира (опционально)<br/><input id="apt" class="w-full p-2 rounded text-black"/></label><div class="flex gap-3"><button class="px-4 py-2 bg-emerald-500 rounded">Оплатить (заглушка)</button><a href="cart.html" class="px-4 py-2 border rounded">Вернуться</a></div></form><div id="msg" class="mt-2"></div></div><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const cart=load('cart'); if(!cart.length){document.getElementById('msg').innerText='Корзина пуста';return;} const order={id:Date.now(), name:document.getElementById('name').value, phone:document.getElementById('phone').value, address:document.getElementById('address').value, apt:document.getElementById('apt').value, items:cart, total: cart.reduce((s,i)=>s + (Number(i.price)||0)*(i.qty||1),0), date: new Date().toISOString()}; const orders = load('orders'); orders.unshift(order); save('orders', orders); localStorage.removeItem('cart'); location.href='success.html?order='+order.id;});</script></body></html>
