<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Админ - Управление</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:url('фыв.jpg') center/cover fixed;min-height:100vh} .overlay{position:fixed;inset:0;background:rgba(7,10,25,0.5);backdrop-filter:blur(6px);z-index:0} .wrap{position:relative;z-index:1;max-width:1100px;margin:40px auto;padding:20px;background:linear-gradient(180deg,rgba(255,255,255,0.92),rgba(255,255,255,0.85));border-radius:16px} .card{transition:transform .2s ease, box-shadow .2s ease} .card:hover{transform:translateY(-6px);box-shadow:0 10px 30px rgba(2,6,23,0.12)}</style></head><body><div class="overlay"></div><div class="wrap text-slate-800"><header class="flex items-center justify-between"><h1 class="text-3xl font-bold">Админ — Управление</h1><a href="lepestok_shop.html" class="px-3 py-2 bg-emerald-500 text-white rounded">Открыть сайт</a></header><section class="mt-6 card p-4 rounded-lg"><h2 class="text-xl font-semibold">Добавить / Редактировать товар</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3"><input id="title" placeholder="Название" class="p-2 border rounded"/><input id="price" placeholder="Цена" class="p-2 border rounded"/><input id="img" type="file" accept="image/*" class="p-2 border rounded"/></div><div class="mt-3 flex gap-2"><button id="addBtn" class="px-4 py-2 bg-emerald-500 text-white rounded">Добавить товар</button><button id="saveEdit" class="px-4 py-2 bg-blue-600 text-white rounded hidden">Сохранить изменения</button><button id="cancelEdit" class="px-4 py-2 border rounded hidden">Отмена</button></div></section><section class="mt-6 card p-4 rounded-lg"><h2 class="text-xl font-semibold">Товары</h2><div id="prodList" class="mt-3 space-y-3"></div></section><section class="mt-6 card p-4 rounded-lg"><h2 class="text-xl font-semibold">История заказов</h2><div id="orders" class="mt-3 space-y-3"></div></section></div><script>function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function renderProducts(){const list=load('products'); const root=document.getElementById('prodList'); if(!list.length){root.innerHTML='<div class="p-4 bg-white rounded">Нет товаров</div>';return;} root.innerHTML = list.map((p,i)=>`<div class="p-3 bg-white rounded flex items-center gap-3"><img src="${p.img||'6873440802.jpg'}" class="w-24 h-16 object-contain rounded"/><div class="flex-1"><div class="font-semibold">${p.title}</div><div class="text-sm text-slate-500">${p.desc||''}</div><div class="text-sm text-emerald-600 font-bold">${Number(p.price||0).toFixed(2)} ₽</div></div><div class="flex flex-col gap-2"><button onclick="startEdit(${i})" class="px-3 py-1 bg-blue-500 text-white rounded">✎ Редактировать</button><button onclick="delProd(${i})" class="px-3 py-1 bg-red-500 text-white rounded">🗑 Удалить</button></div></div>`).join(''); } function delProd(i){ if(!confirm('Удалить товар?')) return; const list=load('products'); list.splice(i,1); save('products',list); renderProducts(); } function startEdit(i){ const list=load('products'); const p=list[i]; document.getElementById('title').value=p.title; document.getElementById('price').value=p.price; document.getElementById('addBtn').classList.add('hidden'); document.getElementById('saveEdit').classList.remove('hidden'); document.getElementById('cancelEdit').classList.remove('hidden'); window.editIndex=i; } document.getElementById('cancelEdit').addEventListener('click',()=>{document.getElementById('addBtn').classList.remove('hidden');document.getElementById('saveEdit').classList.add('hidden');document.getElementById('cancelEdit').classList.add('hidden');document.getElementById('title').value='';document.getElementById('price').value='';document.getElementById('img').value='';window.editIndex=null;}); document.getElementById('saveEdit').addEventListener('click', ()=>{ const idx=window.editIndex; if(idx===undefined||idx===null) return; const list=load('products'); const p=list[idx]; p.title=document.getElementById('title').value; p.price=Number(document.getElementById('price').value)||p.price; const file=document.getElementById('img').files[0]; if(file){ const r=new FileReader(); r.onload=()=>{ p.img=r.result; save('products',list); renderProducts(); resetForm(); }; r.readAsDataURL(file); } else { save('products',list); renderProducts(); resetForm(); } }); function resetForm(){ document.getElementById('addBtn').classList.remove('hidden'); document.getElementById('saveEdit').classList.add('hidden'); document.getElementById('cancelEdit').classList.add('hidden'); document.getElementById('title').value=''; document.getElementById('price').value=''; document.getElementById('img').value=''; window.editIndex=null; } document.getElementById('addBtn').addEventListener('click', ()=>{ const title=document.getElementById('title').value.trim(); const price=document.getElementById('price').value.trim(); const file=document.getElementById('img').files[0]; if(!title||!price||!file){ alert('Заполните название, цену и выберите изображение'); return; } const r=new FileReader(); r.onload=()=>{ const list=load('products'); list.unshift({id:Date.now(), title, price: Number(price)||0, desc:'', img:r.result}); save('products',list); renderProducts(); resetForm(); alert('Товар добавлен'); }; r.readAsDataURL(file); }); function renderOrders(){ const list=load('orders'); const root=document.getElementById('orders'); if(!list.length){ root.innerHTML='<div class="p-4 bg-white rounded">Нет заказов</div>'; return; } root.innerHTML = list.map((o,i)=>`<div class="p-3 bg-white rounded"><div class="flex justify-between items-start"><div><div><strong>Номер заказа:</strong> ${o.id}</div><div><strong>Имя:</strong> ${o.name}</div><div><strong>Телефон:</strong> ${o.phone}</div><div><strong>Адрес:</strong> ${o.address} ${o.apt||''}</div><div class="mt-2"><strong>Товары:</strong><ul>${(o.items||[]).map(it=>'<li>'+ (it.title||it.name || '') +' × '+(it.qty||1)+'</li>').join('')}</ul></div></div><div class="flex flex-col gap-2"><button onclick="delOrder(${i})" class="px-3 py-1 bg-red-500 text-white rounded">Удалить заказ</button></div></div></div>`).join(''); } function delOrder(i){ if(!confirm('Удалить заказ?')) return; const list=load('orders'); list.splice(i,1); save('orders', list); renderOrders(); } if(!localStorage.getItem('products')){ localStorage.setItem('products', JSON.stringify([{id:1,title:'Лепесток — Кола',price:49.99,desc:'Освежающие леденцы',img:'6873440802.jpg'}])); } renderProducts(); renderOrders();</script></body></html>
